<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" width="100%" height="100%">
  <defs>
    <!-- Pattern chấm ma trận cho bề mặt quả địa cầu -->
    <pattern id="globeDots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#70b4ff" opacity="0.85" />
    </pattern>

    <!-- Clip path giới hạn trong hình cầu -->
    <clipPath id="globeClip">
      <circle cx="560" cy="140" r="88" />
    </clipPath>

    <!-- Mặt nạ hiển thị lục địa (châu Âu, châu Phi, châu Á) qua ma trận chấm -->
    <mask id="continentMask">
      <rect width="750" height="320" fill="black" />
      <!-- Hình dạng cách điệu khối lục địa nổi bật -->
      <path d="M 520,70 
               Q 545,65 565,80 
               Q 580,95 560,110 
               Q 575,120 590,115 
               Q 615,130 600,165 
               Q 575,190 565,225 
               Q 550,230 535,215 
               Q 540,180 525,160 
               Q 510,145 525,120 
               Q 505,100 520,70 Z" fill="white" />
      <path d="M 590,85 Q 630,90 645,120 Q 640,150 610,145 Q 600,120 590,85 Z" fill="white" />
    </mask>

    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <g id="Logo-Right-Globe">
    <!-- Kinh tuyến / vĩ tuyến mờ của quả cầu -->
    <circle cx="560" cy="140" r="88" fill="none" stroke="#5b9bf8" stroke-width="2.5" opacity="0.6" />
    <ellipse cx="560" cy="140" rx="45" ry="88" fill="none" stroke="#5b9bf8" stroke-width="1.5" opacity="0.4" />
    <ellipse cx="560" cy="140" rx="88" ry="35" fill="none" stroke="#5b9bf8" stroke-width="1.5" opacity="0.4" />
    <line x1="472" y1="140" x2="648" y2="140" stroke="#5b9bf8" stroke-width="1.5" opacity="0.4" />

    <!-- Lục địa dạng chấm Matrix -->
    <g clip-path="url(#globeClip)">
      <rect x="460" y="40" width="200" height="200" fill="url(#globeDots)" mask="url(#continentMask)" />
    </g>

    <!-- Vành cung trăng khuyết / quỹ đạo vàng ôm lấy quả địa cầu -->
    <path d="M 485,108 
             C 525,35 625,32 660,78 
             C 700,130 690,215 615,255 
             C 545,290 490,245 490,245 
             C 545,268 625,262 655,200 
             C 680,145 645,80 575,68 
             C 530,60 498,90 485,108 Z" fill="url(#yellowGrad)" />
  </g>

  <g id="Brand-Name" fill="#FFFFFF">
    <!-- Chữ BẢN -->
    <!-- B -->
    <path d="M 85,130 L 122,130 C 138,130 148,137 148,148 C 148,157 142,163 133,166 C 145,170 152,177 152,190 C 152,204 139,215 120,215 L 85,215 Z 
             M 106,147 L 106,163 L 120,163 C 126,163 130,160 130,155 C 130,150 126,147 120,147 Z 
             M 106,179 L 106,198 L 122,198 C 128,198 133,194 133,188 C 133,182 128,179 122,179 Z" />

    <!-- Dấu hỏi trên chữ a -->
    <path d="M 182,122 C 182,114 188,109 196,109 C 203,109 208,113 208,119 C 208,124 204,127 199,130 C 196,132 195,135 195,139 L 186,139 C 186,133 189,129 193,126 C 196,124 198,122 198,119 C 198,117 196,115 194,115 C 191,115 189,117 189,120 Z 
             M 186,143 L 195,143 L 195,147 L 186,147 Z" fill="#FFFFFF" />

    <!-- a -->
    <path d="M 197,150 C 213,150 223,161 223,176 L 223,215 L 206,215 L 206,204 C 201,212 193,217 182,217 C 168,217 158,206 158,193 C 158,179 170,169 188,169 L 205,169 L 205,167 C 205,160 199,156 191,156 C 183,156 177,160 175,165 L 160,160 C 165,152 179,150 197,150 Z 
             M 205,182 L 189,182 C 182,182 177,186 177,192 C 177,198 182,202 189,202 C 198,202 205,195 205,186 Z" />

    <!-- n -->
    <path d="M 235,152 L 253,152 L 253,163 C 259,155 268,150 279,150 C 295,150 305,160 305,178 L 305,215 L 286,215 L 286,182 C 286,173 281,168 273,168 C 263,168 255,175 255,186 L 255,215 L 235,215 Z" />

    <!-- Chữ VIỆT -->
    <!-- V (với vạt màu vàng đặc trưng ở góc trên bên phải) -->
    <polygon points="323,130 351,215 373,215 403,130 380,130 363,186 345,130" />
    <polygon points="397,130 412,130 398,152 390,152" fill="url(#yellowGrad)" />

    <!-- i -->
    <rect x="415" y="152" width="18" height="63" />

    <!-- Dấu mũ ê -->
    <path d="M 456,128 L 468,139 L 461,143 L 452,135 L 443,143 L 436,139 Z" />

    <!-- e -->
    <path d="M 452,150 C 471,150 484,163 484,183 C 484,186 483,190 482,192 L 441,192 C 442,200 448,204 456,204 C 463,204 468,201 472,197 L 482,207 C 475,214 466,217 454,217 C 435,217 421,203 421,183 C 421,164 434,150 452,150 Z 
             M 441,178 L 467,178 C 466,171 461,164 452,164 C 445,164 442,170 441,178 Z" />

    <!-- t -->
    <path d="M 503,136 L 503,152 L 518,152 L 518,168 L 503,168 L 503,198 C 503,202 506,204 511,204 L 518,204 L 518,217 C 511,217 500,217 493,212 C 487,206 485,198 485,188 L 485,168 L 474,168 L 474,152 L 485,152 L 485,136 Z" />

    <!-- Dấu nặng dưới chữ e/t -->
    <rect x="461" y="224" width="15" height="15" />
  </g>

  <!-- Slogan: Bản sắc Việt - Giá trị toàn cầu -->
  <g id="Slogan">
    <text x="86" y="248" fill="url(#yellowGrad)" font-family="&#39;Times New Roman&#39;, &#39;Playfair Display&#39;, &#39;Merriweather&#39;, serif" font-size="22" font-weight="bold" font-style="italic" letter-spacing="0.8">
      Bản sắc Việt - Giá trị toàn cầu
    </text>
  </g>
</svg>